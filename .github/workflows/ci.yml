name: quality-and-build
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/*.lock
      - name: Install hash-verified development dependencies
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Python, shell and schema checks
        run: |
          ruff check .
          ruff format --check .
          shellcheck setup-iam.sh setup-lambdas.sh deploy.sh setup-alerts.sh scripts/common.sh
          python scripts/validate_schemas.py
      - name: Unit, contract and UI regression tests (no AWS access)
        run: python -m pytest --junitxml=.build/tests.xml
      - name: Secret candidate scan
        run: python scripts/check_secrets.py
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements/dev.lock --disable-pip --no-deps --format json --output .build/dependency-audit.json
      - name: Download hash-verified Lambda wheels
        run: python -m pip download --require-hashes --only-binary=:all: --dest .build/wheels -r requirements/lambda.lock
      - name: Independent deterministic builds and isolated package imports
        run: python scripts/verify_build.py
      - name: Save validation and artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-validation
          path: |
            .build/tests.xml
            .build/dependency-audit.json
            .build/build-validation.json
            .build/lambda-a/*.zip
            .build/lambda-a/manifest.json
          retention-days: 14
